<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#faf8ef"><title>2048 · 再合一次</title>
<link rel="stylesheet" href="style.css"><script src="game.js" defer></script><script src="app.js" defer></script>
</head>
<body><main>
<header><div><p class="eyebrow">小小方格，无限可能</p><h1>2048<span>·</span></h1></div><div class="scores"><div class="score"><span>得分</span><strong id="score">0</strong></div><div class="score"><span>最高分</span><strong id="best">0</strong></div></div></header>
<div class="intro"><p>合并相同数字，向 <b>2048</b> 出发。</p><button id="restart">重新开始 ↻</button></div>
<section class="play-area" aria-label="2048 游戏"><div id="board" class="board" role="group" aria-label="游戏棋盘" tabindex="0"></div><div id="overlay" class="overlay" hidden><h2 id="message"></h2><p id="detail"></p><button id="again">再来一局</button><button id="continue" hidden>继续挑战</button></div></section>
<p id="status" role="status" aria-live="polite">准备好了吗？让数字动起来。</p>
<div class="directions" aria-label="方向控制"><button data-direction="up" aria-label="向上">↑</button><div><button data-direction="left" aria-label="向左">←</button><button data-direction="down" aria-label="向下">↓</button><button data-direction="right" aria-label="向右">→</button></div></div>
<footer><b>玩法</b> 使用方向键、WASD，或在棋盘上滑动。<br>每次移动，相同的数字相遇就会合并。<span>慢慢想，再走一步。</span></footer>
</main></body></html>
